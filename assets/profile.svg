<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Profile avatar">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="40" fill="#071124"/>
  <g filter="url(#soft)">
    <circle cx="300" cy="220" r="110" fill="url(#g)" />
  </g>
  <rect x="140" y="360" width="320" height="84" rx="14" fill="#0b1220" opacity="0.9"/>
  <text x="300" y="238" text-anchor="middle" font-family="Inter, Arial" font-size="96" fill="#022233" font-weight="700">AM</text>
</svg>
